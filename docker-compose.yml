# Sobe a Donna com um volume persistente para o banco SQLite.
# Uso:  docker compose up -d                       (núcleo)
#       docker compose --profile whatsapp up -d    (núcleo + WhatsApp)
services:
  donna:
    build: .
    container_name: donna
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data

  # Opcional (somente leitura). Só sobe com:  --profile whatsapp
  donna-whatsapp:
    build: ./donna/ingest/whatsapp
    container_name: donna-whatsapp
    restart: unless-stopped
    profiles: ["whatsapp"]
    environment:
      DONNA_DB_PATH: /app/data/donna.db
    volumes:
      - ./data:/app/data
      - ./donna/ingest/whatsapp/auth:/app/whatsapp/auth
